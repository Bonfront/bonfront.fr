    <!-- INTRODUCTION -->
    <div class="section">
      <h2 class="section-title">Introduction</h2>
      <p>Le présent document informe les Utilisateurs des technologies permettant à cette Application d'atteindre les finalités décrites ci-dessous. Ces technologies permettent au Propriétaire d'accéder à des informations et de les stocker (à l'aide d'un Cookie, par exemple) ou d'utiliser des ressources sur l'appareil d'un Utilisateur lorsque celui-ci interagit avec cette Application.</p>
      <p>Par souci de simplification, toutes ces technologies sont définies comme étant des « Traqueurs » dans le présent document, à moins qu'il n'existe une raison de les différencier.</p>
      <p>Certaines des finalités pour lesquelles les Traqueurs sont utilisés peuvent nécessiter le consentement de l'Utilisateur. Lorsque le consentement est donné, il peut être librement retiré à tout moment en suivant les instructions fournies dans le présent document.</p>
    </div>

      <h2 class="section-title">Utilisation des Traqueurs par cette Application</h2>

      <h3 class="section-subtitle">Nécessaires</h3>
      <p>Cette Application utilise des Cookies dits « techniques » et d'autres Traqueurs similaires pour mener des activités strictement nécessaires au fonctionnement ou à la fourniture du Service.</p>

      <div class="service-card">
        <div class="service-icon">AI</div>
        <div class="service-info">
          <h4>Widget de chat IA Bonfront (sessionStorage)</h4>
          <p>Traqueur technique · Session uniquement · Le widget de chat intégré au site utilise le sessionStorage du navigateur pour stocker un identifiant de session anonyme et l'historique de la conversation en cours. Ces données sont automatiquement supprimées à la fermeture de l'onglet et ne sont jamais transmises à des tiers à des fins publicitaires. Aucun cookie persistant n'est déposé par ce widget.</p>
        </div>
      </div>

      <h3 class="section-subtitle">Expérience</h3>
      <p>Cette Application utilise des Traqueurs pour améliorer la qualité de l'expérience utilisateur et permettre les interactions avec le contenu, les réseaux et les plateformes externes.</p>

      <p>Cette Application utilise des Traqueurs pour mesurer le trafic et analyser le comportement des Utilisateurs dans le but d'améliorer le Service.</p>

      <div class="service-card">
        <div class="service-icon">G</div>

    <!-- GESTION -->
    <div class="section">
      <h2 class="section-title">Comment gérer les préférences et donner ou retirer son consentement</h2>
      <p>Lorsque l'utilisation des Traqueurs repose sur le consentement de l'utilisateur, celui-ci peut donner ou retirer son consentement en définissant ou en mettant à jour ses préférences dans le panneau des choix en matière de confidentialité disponible sur cette Application.</p>
      <p>S'agissant des Traqueurs tiers, les Utilisateurs peuvent gérer leurs préférences par le lien de retrait associé ou en contactant directement le tiers concerné.</p>
      <p>Concernant le widget de chat IA, l'Utilisateur peut à tout moment vider le sessionStorage de son navigateur pour effacer les données de session locales. Ces données étant stockées uniquement en session, elles disparaissent automatiquement à la fermeture de l'onglet.</p>
    </div>

      <h2 class="section-title">Comment contrôler ou supprimer les Cookies via les paramètres de votre appareil</h2>
      <p>Les Utilisateurs peuvent gérer les Cookies directement depuis leur navigateur. Voici les liens vers les guides des navigateurs les plus utilisés :</p>
      <ul>
        <li><a href="https://support.google.com/chrome/answer/95647" target="_blank">Google Chrome</a></li>

      <p>Toutefois, les paramètres du navigateur ne permettent pas un contrôle précis du consentement par catégorie.</p>
    </div>

    <!-- CONSEQUENCES -->
    <div class="section">
      <h2 class="section-title">Conséquences du refus de l'utilisation des Traqueurs</h2>
      <p>L'Utilisateur est libre de décider d'autoriser ou non l'utilisation de Traqueurs. Toutefois, il convient de noter que les Traqueurs permettent à cette Application de fournir aux Utilisateurs une meilleure expérience et des fonctionnalités avancées. Si l'Utilisateur décide de bloquer l'utilisation des Traqueurs, il est possible que le Propriétaire ne soit pas en mesure de fournir les fonctionnalités connexes, notamment le widget de chat IA qui requiert le sessionStorage pour fonctionner correctement.</p>
    </div>

    <!-- DEFINITIONS -->
    <div class="section">
      <h2 class="section-title">Définitions et références légales</h2>

      <h3 class="section-subtitle">Données personnelles (ou Données)</h3>
      <p>Toute information qui, directement, indirectement ou en relation avec d'autres informations, permet l'identification ou l'identifiabilité d'une personne physique.</p>

      <h3 class="section-subtitle">Cookie</h3>
      <p>Les Cookies sont des Traqueurs constitués de petits ensembles de données stockés dans le navigateur de l'Utilisateur.</p>

      <h3 class="section-subtitle">sessionStorage</h3>
      <p>Mécanisme de stockage local du navigateur permettant de conserver des données temporairement, uniquement pour la durée d'une session (onglet ouvert). Contrairement aux Cookies, les données du sessionStorage ne sont pas transmises au serveur à chaque requête et sont automatiquement supprimées à la fermeture de l'onglet.</p>

      <h3 class="section-subtitle">Traqueurs</h3>
      <p>Un Traqueur indique toute technologie — par exemple, les Cookies, les identifiants uniques, les balises Web, les scripts intégrés, le sessionStorage — permettant de suivre les Utilisateurs, par exemple en accédant à des informations ou en les stockant sur l'appareil de l'Utilisateur.</p>

      <h3 class="section-subtitle">Informations légales</h3>
      <p>Cette politique concerne uniquement cette Application, sauf indication contraire dans le présent document. Elle a été rédigée conformément au Règlement (UE) 2016/679 (RGPD).</p>
